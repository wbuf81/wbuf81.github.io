/* DECISIONS (RULINGS 1: where DESIGN.md is silent, or where tuning moved a start value)
 * - Physics: g = 12 (spec start 16). With corners in half-unit steps the gentlest slope is 0.5/tile; at g = 16 that slope
 *   pulls at 8 tiles/s^2, almost the whole push (A = 9), so climbs were a slog and every ramp a runaway. At 12 a 0.5 ramp
 *   is holdable and a 1.0 ramp (chart descents) is not: braking matters there by design. Everything else is the spec value.
 * - Ground-stick: the marble leaves the ground when the surface falls away more than 0.035 per step below its ballistic
 *   path (crests launch at speed, small kinks do not). One small bounce (x0.22) on impacts over 4 tiles/s.
 * - Lost: below every tile corner within two tiles by 0.6, or two tiles off the map. Air control 0.3 of the push.
 * - Boost: on entering a strip, velocity along it becomes min(14, max(v,0)+7); the soft cap bleeds the excess at 1.4/s.
 * - Rails: lips only on a strip's lateral edges that face the void (never across the direction of travel, so jumps and
 *   ledges stay open); ice/sand edge tiles on railed strips become rail tiles.
 * - Crumble: gone 0.5 s after the first touch, back 3.5 s later once the marble is clear.
 * - Gust: 3 s cycle = 0.8 s warn, 1.2 s blow (7 tiles/s^2 across the ridge), 1.0 s idle. Dolce: bats 6 tiles/s across the
 *   route when awake and within 1.15 tiles, 1.2 s cooldown, naps on her own fixed cycle.
 * - Cup: drop in under 5 tiles/s within 0.2 of the centre; faster = "LIPPED OUT" caption and the marble rolls on.
 * - Medals use the FINAL time (raw minus 0.5 s per pickup). Course 3: "beat Angela" = final time under her time (= gold).
 * - Grades: A band is 0.85..1.0 of gold (A+ below 0.85 x gold); D thirds span bronze..1.5 x bronze.
 * - Pickups are the 24 personalised wallet items (legendaries, star epics, the fish, the photo, the apology, the glove);
 *   the generic commons (cards, receipts, coins...) would not fit "4-6 per course".
 * - Retry countdown is 1.2 s (first start 2.1 s). The camera sits the marble ~7% above centre with a velocity lead.
 * - Tilt axes: portrait x = gamma, y = beta; landscape swaps them by screen.orientation.angle (untested on a device).
 * - Name entry is a DOM field so the phone keyboard appears; A-Z only, 7 max.
 * - Bots, ?debug and ?headless never submit. GET /top is fetched on title, course select and board.
 */
