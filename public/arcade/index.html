<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C SQUAD ARCADE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Five games made for the C Squad. Pick a cabinet.">
<meta property="og:title" content="C SQUAD ARCADE">
<meta property="og:description" content="Five games made for the C Squad. Pick a cabinet.">
<meta property="og:image" content="https://wesleybard.com/arcade/share/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://wesleybard.com/arcade/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0714; --panel: #150d24; --ink: #f4f1e6; --dim: #a9a3c6; --gold: #ffc42e; --pink: #ff4fa3; --teal: #2fd0c0; --lime: #b6ff2e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--ink); overflow-x: hidden; }
  body { background: transparent; }
  body { font-family: "Press Start 2P", "Courier New", ui-monospace, monospace; min-height: 100vh; min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom)); }
  /* the arcade room: a fixed layer so it stays put while the page scrolls (background-attachment: fixed is unreliable on iOS) */
  body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: #0b0714 url(img/bg.jpg) center 40% / cover no-repeat; filter: brightness(1.7) saturate(1.25); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(11,7,20,.35), rgba(11,7,20,0) 30%, rgba(11,7,20,.25) 70%, rgba(11,7,20,.85)); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); }
  header { text-align: center; padding: 2px 0 6px; }
  .hero { display: block; width: 100%; max-width: 620px; height: auto; margin: 0 auto; filter: drop-shadow(0 0 18px rgba(255, 79, 163, .35)); }
  h1 { margin: 0; font-size: clamp(22px, 7.4vw, 52px); line-height: 1.15; letter-spacing: .04em; color: var(--gold);
    text-shadow: 3px 3px 0 #7a2a18, 6px 6px 0 #1a1026, 0 0 26px rgba(255, 196, 46, .45); }
  h1 span { color: var(--pink); text-shadow: 3px 3px 0 #5a0f3a, 6px 6px 0 #1a1026, 0 0 26px rgba(255, 79, 163, .5); }
  .has-sign h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .sub { margin: 10px 0 0; font-size: clamp(8px, 2.5vw, 12px); line-height: 1.7; color: var(--dim); letter-spacing: .08em; }
  .blink { animation: b 1.1s steps(2, jump-none) infinite; color: var(--lime); }
  @keyframes b { 50% { opacity: .2; } }
  h2 { font-size: clamp(11px, 3.4vw, 16px); letter-spacing: .1em; color: var(--teal); margin: 30px 0 14px; text-align: center; text-shadow: 0 0 14px rgba(47,208,192,.5); }

  /* ---- the row of cabinets: a flat line-up standing on the arcade floor; swipe sideways on a phone ---- */
  .row { --w: min(60vw, 250px); display: flex; align-items: flex-end; gap: 14px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 22px calc(50% - var(--w) / 2) 18px; }
  .row::-webkit-scrollbar { display: none; }
  @media (min-width: 1000px) { .row { --w: 172px; justify-content: center; overflow: visible; padding: 26px 20px 18px; gap: 20px; } .swipe { display: none; } }
  a.slot { flex: none; width: var(--w); scroll-snap-align: center; color: inherit; text-decoration: none; text-align: center; -webkit-tap-highlight-color: transparent; transition: transform .14s ease; }
  a.slot:active { transform: translateY(3px); }
  @media (hover: hover) { a.slot:hover { transform: translateY(-6px); } }
  .cabinet { position: relative; }
  .cabinet img.art { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 14px rgba(0,0,0,.6)); }
  .cabinet::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: -10px; height: 20px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), transparent); z-index: -1; }
  /* drawn cabinet (used until a picture is supplied) */
  .box { aspect-ratio: 10 / 17; display: flex; flex-direction: column; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, #24173a, #120a20); border: 3px solid var(--c);
    box-shadow: 0 0 0 3px #05030a, 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); overflow: hidden; }
  .marquee { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c)); color: #140b1c; text-align: center; font-size: calc(var(--w) * .044); line-height: 1.5; padding: 10px 6px 9px;
    min-height: 3.7em; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #05030a; }
  .screen { margin: 10px 9px 0; border: 3px solid #05030a; border-radius: 6px; background: #000; aspect-ratio: 4 / 3; overflow: hidden; position: relative; flex: none; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  .deck { margin: 10px 9px 0; height: 30px; border-radius: 3px; background: linear-gradient(180deg, #2c1d46, #1a1030); border: 2px solid #05030a; display: flex; align-items: center; justify-content: center; gap: 16px; flex: none; }
  .stick { width: 7px; height: 16px; background: #c9c3df; border-radius: 3px; position: relative; }
  .stick::before { content: ""; position: absolute; left: -4px; top: -8px; width: 15px; height: 15px; border-radius: 50%; background: #ff3b3b; box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
  .btn { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), 0 0 6px var(--c); }
  .kick { flex: 1; margin: 10px 9px 9px; border-radius: 3px; border: 2px solid #05030a; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 28%, #120a20) 0 10px, #120a20 10px 20px); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .coin { width: 26px; height: 34px; border: 2px solid #05030a; border-radius: 3px; background: #0b0714; box-shadow: inset 0 0 0 2px #3a2a5a; position: relative; }
  .coin::after { content: ""; position: absolute; left: 10px; top: 8px; width: 3px; height: 14px; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .cap { margin-top: 18px; }
  .cap .t { font-size: calc(var(--w) * .052); line-height: 1.5; color: var(--c); text-shadow: 2px 2px 0 #05030a; min-height: 3em; display: flex; align-items: center; justify-content: center; }
  .cap .tag { margin-top: 6px; font-size: calc(var(--w) * .034); line-height: 1.8; color: var(--ink); min-height: 5.4em; }
  .cap .play { display: inline-block; margin-top: 6px; font-size: calc(var(--w) * .056); color: #140b1c; background: var(--lime); padding: 11px 18px 9px; border-radius: 4px; box-shadow: 0 4px 0 #5c8a12, 0 0 18px rgba(182,255,46,.4); }
  .cap .champ { margin-top: 12px; font-size: calc(var(--w) * .034); color: var(--gold); min-height: 1.6em; }
  .swipe { text-align: center; font-size: 7px; color: var(--dim); letter-spacing: .1em; margin-top: 6px; }

  .boards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 760px) { .boards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .board { --c: var(--teal); background: rgba(21, 13, 36, .88); border: 3px solid var(--c); border-radius: 6px; box-shadow: 0 0 0 3px #05030a, 0 0 18px color-mix(in srgb, var(--c) 35%, transparent); padding: 12px 12px 10px; min-width: 0; }
  .board h3 { margin: 0 0 4px; font-size: clamp(9px, 2.8vw, 11px); color: var(--c); line-height: 1.5; letter-spacing: .04em; }
  .board .what { font-size: 7px; color: var(--dim); margin-bottom: 10px; letter-spacing: .05em; line-height: 1.6; }
  .board ol { list-style: none; margin: 0; padding: 0; }
  .board li { display: flex; align-items: baseline; gap: 8px; font-size: clamp(9px, 2.8vw, 11px); padding: 6px 0; border-top: 1px dashed rgba(255,255,255,.1); }
  .board li:first-child { border-top: 0; color: var(--gold); }
  .rk { width: 2.2em; color: var(--dim); flex: none; }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc { flex: none; font-variant-numeric: tabular-nums; }
  .empty { font-size: 8px; color: var(--dim); padding: 10px 0; line-height: 1.7; }
  footer { text-align: center; font-size: 7px; color: var(--dim); margin-top: 34px; line-height: 2; letter-spacing: .06em; padding: 0 14px; }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<header class="wrap">
  <img class="hero" src="img/sign.png" alt="C Squad Arcade" onerror="this.remove()" onload="document.body.classList.add('has-sign')">
  <h1>C SQUAD <span>ARCADE</span></h1>
  <p class="sub">FIVE GAMES. ONE GROUP CHAT. <span class="blink">INSERT THUMB</span></p>
</header>

<main>
  <div class="row" id="row" aria-label="Arcade cabinets"></div>
  <div class="swipe">&lt; SWIPE TO WALK THE FLOOR &gt;</div>

  <div class="wrap">
    <h2>HIGH SCORES</h2>
    <div class="boards" id="boards"></div>
  </div>
</main>

<footer>GLOBAL LEADERBOARDS · EVERYONE WHO PLAYS IS ON THEM<br>NAUGHTY NAMES BELONG TO TANNER NOW</footer>

<script>
// Cabinet pictures are optional. Drop img/cab-<id>.png (a three-quarter view) to replace the drawn cabinet.
var GAMES = [
  { id: 'conair',       title: 'CON AIR',                 url: '/conair/',       shot: '/conair/share/og.jpg',       c: '#ffb13b', tag: 'CONNIE BET THE HOUSE ON THE JAGS. HOLD TO FART.' },
  { id: 'marbles',      title: "ROB'S MARBLE DADNESS",    url: '/marbles/',      shot: '/marbles/share/og.png',      c: '#2fd0c0', tag: 'FIVE COURSES. ANGELA IS SLIGHTLY AHEAD.' },
  { id: 'walletroyale', title: "ROB'S WALLET ROYALE",     url: '/walletroyale/', shot: '/walletroyale/share/og.png', c: '#b6ff2e', tag: 'STACK IT. CLOSE IT. IT DOES NOT CLOSE.' },
  { id: 'welldone',     title: 'WELL DONE!',              url: '/welldone/',     shot: '/welldone/share/og.png',     c: '#ff6a3d', tag: "THE SPECIAL AT DAVID'S. IT WAS DRY, THOUGH." },
  { id: 'fivepointtwo', title: "C SQUADBREAKER '99",      url: '/fivepointtwo/', shot: '/fivepointtwo/share/og.png', c: '#ff4fa3', tag: 'BLOCKS. BEEF. THE WHOLE SQUAD.' }
];
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
var row = document.getElementById('row');
function drawn(g) {
  var box = el('div', 'box');
  box.appendChild(el('div', 'marquee', g.title));
  var screen = el('div', 'screen'), shot = new Image(); shot.src = g.shot; shot.alt = ''; screen.appendChild(shot); box.appendChild(screen);
  var deck = el('div', 'deck'); deck.appendChild(el('span', 'stick')); deck.appendChild(el('span', 'btn')); deck.appendChild(el('span', 'btn')); deck.appendChild(el('span', 'btn')); box.appendChild(deck);
  var kick = el('div', 'kick'); kick.appendChild(el('span', 'coin')); box.appendChild(kick);
  return box;
}
GAMES.forEach(function (g) {
  var a = el('a', 'slot'); a.href = g.url; a.style.setProperty('--c', g.c);
  var cab = el('div', 'cabinet'); cab.appendChild(drawn(g));
  // optional picture of the whole cabinet (front and side in one three-quarter view)
  var im = new Image(); im.className = 'art'; im.alt = g.title + ' arcade cabinet'; im.onload = function () { cab.textContent = ''; cab.appendChild(im); }; im.src = 'img/cab-' + g.id + '.png';
  a.appendChild(cab);
  var cap = el('div', 'cap'); cap.appendChild(el('div', 't', g.title)); cap.appendChild(el('div', 'tag', g.tag)); cap.appendChild(el('span', 'play', 'PLAY'));
  var ch = el('div', 'champ'); ch.id = 'champ-' + g.id; cap.appendChild(ch); a.appendChild(cap);
  row.appendChild(a);
});

// ---- high scores ----
var boards = document.getElementById('boards');
function board(title, what, color) {
  var b = el('section', 'board'); b.style.setProperty('--c', color); b.appendChild(el('h3', '', title)); var w = el('div', 'what', what); b.appendChild(w);
  var ol = el('ol'); ol.appendChild(el('div', 'empty', 'LOADING...')); b.appendChild(ol); boards.appendChild(b); ol.what = w; return ol;
}
function fill(ol, rows, fmt) {
  ol.textContent = '';
  if (!rows || !rows.length) { ol.appendChild(el('div', 'empty', 'NO SCORES YET. BE FIRST.')); return; }
  rows.slice(0, 5).forEach(function (r, i) {
    var li = el('li'); li.appendChild(el('span', 'rk', (i + 1) + '.')); li.appendChild(el('span', 'nm', String(r.name || '???'))); li.appendChild(el('span', 'sc', fmt(r))); ol.appendChild(li);
  });
}
function offline(ol) { ol.textContent = ''; ol.appendChild(el('div', 'empty', 'BOARD OFFLINE. TRY AGAIN LATER.')); }
function champ(id, name) { var c = document.getElementById('champ-' + id); if (c) c.textContent = 'CHAMP: ' + name; }
function mmss(ms) { var s = ms / 1000, m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(2).padStart(5, '0'); }
function get(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }

var olC = board('CON AIR', 'ENDLESS · FARTHEST FLIGHT', '#ffb13b');
var olM = board('MARBLE DADNESS', 'ALL FIVE COURSES · FASTEST TOTAL', '#2fd0c0');
var olW = board('WALLET ROYALE', 'MOST STUFF IN THE WALLET', '#b6ff2e');

get('https://conair-scores.wes-bard.workers.dev/top').then(function (d) {
  var rows = d.all || []; fill(olC, rows, function (r) { return r.m + ' M'; }); if (rows[0]) champ('conair', rows[0].name);
}).catch(function () { offline(olC); });

get('https://marbles-scores.wes-bard.workers.dev/top?level=all').then(function (d) {
  var rows = d.total || [];
  if (rows.length) { fill(olM, rows, function (r) { return mmss(r.ms); }); champ('marbles', rows[0].name); return; }
  var wins = {}, lv = d.levels || {};   // nobody has finished all five yet: show who holds the most course records
  Object.keys(lv).forEach(function (k) { var t = lv[k][0]; if (t) wins[t.name] = (wins[t.name] || 0) + 1; });
  var list = Object.keys(wins).map(function (n) { return { name: n, n: wins[n] }; }).sort(function (a, b) { return b.n - a.n; });
  olM.what.textContent = 'COURSE RECORDS HELD'; fill(olM, list, function (r) { return r.n + ' OF 5'; }); if (list[0]) champ('marbles', list[0].name);
}).catch(function () { offline(olM); });

get('https://walletroyale-scores.wes-bard.workers.dev/top').then(function (d) {
  var rows = d.rows || []; fill(olW, rows, function (r) { return String(r.score); }); if (rows[0]) champ('walletroyale', rows[0].name);
}).catch(function () { offline(olW); });
</script>
</body>
</html>
