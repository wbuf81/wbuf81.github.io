<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C SQUAD ARCADE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Five games made for the C Squad. Pick a cabinet.">
<meta property="og:title" content="C SQUAD ARCADE">
<meta property="og:description" content="Five games made for the C Squad. Pick a cabinet.">
<meta property="og:image" content="https://wesleybard.com/arcade/share/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://wesleybard.com/arcade/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0714; --panel: #150d24; --ink: #f4f1e6; --dim: #9a94b8; --gold: #ffc42e; --pink: #ff4fa3; --teal: #2fd0c0; --lime: #b6ff2e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Press Start 2P", "Courier New", ui-monospace, monospace; min-height: 100vh; min-height: 100dvh;
    padding: max(18px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255, 79, 163, .16), transparent 60%),
      radial-gradient(90% 50% at 50% 100%, rgba(47, 208, 192, .12), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px), var(--bg); }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; padding: 6px 0 20px; }
  .hero { display: block; width: 100%; max-width: 760px; height: auto; margin: 0 auto 6px; }
  h1 { margin: 0; font-size: clamp(22px, 7.4vw, 52px); line-height: 1.15; letter-spacing: .04em; color: var(--gold);
    text-shadow: 3px 3px 0 #7a2a18, 6px 6px 0 #1a1026, 0 0 26px rgba(255, 196, 46, .45); }
  h1 span { color: var(--pink); text-shadow: 3px 3px 0 #5a0f3a, 6px 6px 0 #1a1026, 0 0 26px rgba(255, 79, 163, .5); }
  .sub { margin: 14px 0 0; font-size: clamp(8px, 2.5vw, 12px); line-height: 1.7; color: var(--dim); letter-spacing: .08em; }
  .blink { animation: b 1.1s steps(2, jump-none) infinite; color: var(--lime); }
  @keyframes b { 50% { opacity: .2; } }
  h2 { font-size: clamp(11px, 3.4vw, 16px); letter-spacing: .1em; color: var(--teal); margin: 34px 0 14px; text-align: center; }

  .floor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  @media (min-width: 620px) { .floor { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 18px; } }
  @media (min-width: 900px) { .floor { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .floor > a:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 6px); }
  @media (min-width: 620px) { .floor > a:last-child:nth-child(odd) { grid-column: auto; width: auto; justify-self: stretch; } }

  a.cab { display: block; color: inherit; text-decoration: none; position: relative; -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
  a.cab:active { transform: translateY(3px) scale(.985); }
  @media (hover: hover) { a.cab:hover { transform: translateY(-4px); } }
  /* the cabinet: an image when one is supplied, otherwise drawn in CSS around the game's own share art */
  .cab img.art { display: block; width: 100%; height: auto; }
  .box { --c: var(--pink); border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, #24173a, #120a20); border: 3px solid var(--c);
    box-shadow: 0 0 0 3px #05030a, 0 0 22px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 0 2px rgba(255,255,255,.05); overflow: hidden; }
  .marquee { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c)); color: #140b1c; text-align: center;
    font-size: clamp(7px, 2.2vw, 10px); line-height: 1.5; padding: 9px 6px 8px; letter-spacing: .04em; min-height: 3.6em; display: flex; align-items: center; justify-content: center;
    border-bottom: 3px solid #05030a; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  .screen { margin: 10px 9px 0; border: 3px solid #05030a; border-radius: 6px; background: #000; aspect-ratio: 4 / 3; overflow: hidden; position: relative; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; }
  .screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); pointer-events: none; }
  .deck { margin: 9px 9px 0; height: 26px; border-radius: 3px; background: linear-gradient(180deg, #2c1d46, #1a1030); border: 2px solid #05030a; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stick { width: 7px; height: 15px; background: #c9c3df; border-radius: 3px; position: relative; }
  .stick::before { content: ""; position: absolute; left: -4px; top: -7px; width: 15px; height: 15px; border-radius: 50%; background: #ff3b3b; box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
  .btn { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: inset -2px -2px 0 rgba(0,0,0,.35), 0 0 6px var(--c); }
  .base { padding: 9px 6px 11px; text-align: center; }
  .tag { font-size: clamp(6px, 1.9vw, 8px); line-height: 1.7; color: var(--dim); min-height: 3.4em; letter-spacing: .03em; }
  .play { display: inline-block; margin-top: 7px; font-size: clamp(8px, 2.5vw, 10px); color: #140b1c; background: var(--lime); padding: 7px 10px 6px; border-radius: 3px; box-shadow: 0 3px 0 #5c8a12; }
  .champ { margin-top: 8px; font-size: clamp(6px, 1.9vw, 8px); color: var(--gold); min-height: 1.6em; letter-spacing: .03em; }

  .boards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 760px) { .boards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .board { --c: var(--teal); background: var(--panel); border: 3px solid var(--c); border-radius: 6px; box-shadow: 0 0 0 3px #05030a; padding: 12px 12px 10px; min-width: 0; }
  .board h3 { margin: 0 0 4px; font-size: clamp(9px, 2.8vw, 11px); color: var(--c); line-height: 1.5; letter-spacing: .04em; }
  .board .what { font-size: 7px; color: var(--dim); margin-bottom: 10px; letter-spacing: .05em; line-height: 1.6; }
  .board ol { list-style: none; margin: 0; padding: 0; }
  .board li { display: flex; align-items: baseline; gap: 8px; font-size: clamp(9px, 2.8vw, 11px); padding: 6px 0; border-top: 1px dashed rgba(255,255,255,.1); }
  .board li:first-child { border-top: 0; color: var(--gold); }
  .rk { width: 2.2em; color: var(--dim); flex: none; }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc { flex: none; font-variant-numeric: tabular-nums; }
  .empty { font-size: 8px; color: var(--dim); padding: 10px 0; line-height: 1.7; }
  footer { text-align: center; font-size: 7px; color: var(--dim); margin-top: 34px; line-height: 2; letter-spacing: .06em; }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } a.cab { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="hero" src="img/sign.png" alt="" onerror="this.remove()">
    <h1>C SQUAD <span>ARCADE</span></h1>
    <p class="sub">FIVE GAMES. ONE GROUP CHAT.<br><span class="blink">INSERT THUMB</span></p>
  </header>

  <main>
    <div class="floor" id="floor"></div>

    <h2>HIGH SCORES</h2>
    <div class="boards" id="boards"></div>
  </main>

  <footer>GLOBAL LEADERBOARDS · EVERYONE WHO PLAYS IS ON THEM<br>NAUGHTY NAMES BELONG TO TANNER NOW</footer>
</div>

<script>
// Each cabinet: drop a picture at img/cab-<id>.png to replace the drawn cabinet for that game.
var GAMES = [
  { id: 'conair',       title: 'CON AIR',                 url: '/conair/',       shot: '/conair/share/og.jpg',       c: '#ffb13b', tag: 'CONNIE BET THE HOUSE ON THE JAGS. HOLD TO FART.' },
  { id: 'marbles',      title: "ROB'S MARBLE DADNESS",    url: '/marbles/',      shot: '/marbles/share/og.png',      c: '#2fd0c0', tag: 'FIVE COURSES. ANGELA IS SLIGHTLY AHEAD.' },
  { id: 'walletroyale', title: "ROB'S WALLET ROYALE",     url: '/walletroyale/', shot: '/walletroyale/share/og.png', c: '#b6ff2e', tag: 'STACK IT. CLOSE IT. IT DOES NOT CLOSE.' },
  { id: 'welldone',     title: 'WELL DONE!',              url: '/welldone/',     shot: '/welldone/share/og.png',     c: '#ff6a3d', tag: "THE SPECIAL AT DAVID'S. IT WAS DRY, THOUGH." },
  { id: 'fivepointtwo', title: "C SQUADBREAKER '99",      url: '/fivepointtwo/', shot: '/fivepointtwo/share/og.png', c: '#ff4fa3', tag: 'BLOCKS. BEEF. THE WHOLE SQUAD.' }
];
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
var floor = document.getElementById('floor');
GAMES.forEach(function (g) {
  var a = el('a', 'cab'); a.href = g.url; a.setAttribute('aria-label', 'Play ' + g.title);
  var box = el('div', 'box'); box.style.setProperty('--c', g.c);
  box.appendChild(el('div', 'marquee', g.title));
  var screen = el('div', 'screen'), shot = new Image(); shot.src = g.shot; shot.alt = ''; shot.loading = 'lazy'; screen.appendChild(shot); box.appendChild(screen);
  var deck = el('div', 'deck'); deck.appendChild(el('span', 'stick')); deck.appendChild(el('span', 'btn')); deck.appendChild(el('span', 'btn')); box.appendChild(deck);
  var base = el('div', 'base'); base.appendChild(el('div', 'tag', g.tag)); base.appendChild(el('span', 'play', 'PLAY')); var ch = el('div', 'champ'); ch.id = 'champ-' + g.id; base.appendChild(ch); box.appendChild(base);
  // optional cabinet picture: shown instead of the drawn cabinet when the file exists
  var art = new Image(); art.className = 'art'; art.alt = g.title + ' arcade cabinet';
  art.onload = function () { a.insertBefore(art, box); box.querySelector('.marquee').remove(); box.querySelector('.screen').remove(); box.querySelector('.deck').remove(); box.style.border = '0'; box.style.boxShadow = 'none'; box.style.background = 'none'; };
  art.src = 'img/cab-' + g.id + '.png';
  a.appendChild(box); floor.appendChild(a);
});

var boards = document.getElementById('boards');
function board(id, title, what, color) {
  var b = el('section', 'board'); b.style.setProperty('--c', color); b.appendChild(el('h3', '', title)); b.appendChild(el('div', 'what', what));
  var ol = el('ol'); ol.id = 'ol-' + id; ol.appendChild(el('div', 'empty', 'LOADING...')); b.appendChild(ol); boards.appendChild(b); return ol;
}
function fill(ol, rows, fmt) {
  ol.textContent = '';
  if (!rows || !rows.length) { ol.appendChild(el('div', 'empty', 'NO SCORES YET. BE FIRST.')); return; }
  rows.slice(0, 5).forEach(function (r, i) {
    var li = el('li'); li.appendChild(el('span', 'rk', (i + 1) + '.')); li.appendChild(el('span', 'nm', String(r.name || '???'))); li.appendChild(el('span', 'sc', fmt(r))); ol.appendChild(li);
  });
}
function offline(ol) { ol.textContent = ''; ol.appendChild(el('div', 'empty', 'BOARD OFFLINE. TRY AGAIN LATER.')); }
function champ(id, text) { var c = document.getElementById('champ-' + id); if (c) c.textContent = text; }
function mmss(ms) { var s = ms / 1000, m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(2).padStart(5, '0'); }
function get(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }

var olC = board('conair', 'CON AIR', 'ENDLESS · FARTHEST FLIGHT', '#ffb13b');
var olM = board('marbles', 'MARBLE DADNESS', 'ALL FIVE COURSES · FASTEST TOTAL', '#2fd0c0');
var olW = board('walletroyale', 'WALLET ROYALE', 'MOST STUFF IN THE WALLET', '#b6ff2e');

get('https://conair-scores.wes-bard.workers.dev/top').then(function (d) {
  var rows = d.all || []; fill(olC, rows, function (r) { return r.m + ' M'; });
  if (rows[0]) champ('conair', 'CHAMP: ' + rows[0].name);
}).catch(function () { offline(olC); });

get('https://marbles-scores.wes-bard.workers.dev/top?level=all').then(function (d) {
  var rows = d.total || [];
  if (rows.length) { fill(olM, rows, function (r) { return mmss(r.ms); }); champ('marbles', 'CHAMP: ' + rows[0].name); return; }
  // nobody has finished all five yet: show who holds the most course records
  var wins = {}, lv = d.levels || {};
  Object.keys(lv).forEach(function (k) { var t = lv[k][0]; if (t) wins[t.name] = (wins[t.name] || 0) + 1; });
  var list = Object.keys(wins).map(function (n) { return { name: n, n: wins[n] }; }).sort(function (a, b) { return b.n - a.n; });
  olM.previousSibling.textContent = 'COURSE RECORDS HELD';
  fill(olM, list, function (r) { return r.n + ' OF 5'; });
  if (list[0]) champ('marbles', 'CHAMP: ' + list[0].name);
}).catch(function () { offline(olM); });

get('https://walletroyale-scores.wes-bard.workers.dev/top').then(function (d) {
  var rows = d.rows || []; fill(olW, rows, function (r) { return String(r.score); });
  if (rows[0]) champ('walletroyale', 'CHAMP: ' + rows[0].name);
}).catch(function () { offline(olW); });
</script>
</body>
</html>
