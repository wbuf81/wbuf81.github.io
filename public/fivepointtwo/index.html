  var crowdSt = { level: 0, src: null, gain: null, nextLfo: 0 };
  var engineSt = { osc: null, gain: null, filt: null, speed: null };

  // ------------------------------------------------------------------ ducking
  function applyDuck() {

  function guitar(t, semi, len, opts) {

    if (opts.third) { var f3 = hz(s + 4); parts.push([f3, -6, MIX.third], [f3, 6, MIX.third]); }

    var v = voice(t, 0.37, dest || N.cleanIn, 'music', 2);
    var e = vGain(v, 0);
    perc(e.gain, t, 0.5 * amp, 0.003, 0.35);
    e.connect(v.out);

  // Ballpark organ (FRIENDS 9): two squares an octave apart, LP 2 kHz, 6 Hz vibrato +-12 cents, level 0.14.

/* ---------- Chair ---------- */
function chairShot() {
  const p = G.piece; if (!p) return;
  // sink up to 3 further rows, deleting every stack cell it overlaps, stopping at the floor
  let sunk = 0;
  while (sunk < 3) { const cs = cellsOf(p, p.m, 0, 1); if (cs.some(([, y]) => y >= ROWS)) break; p.y++; sunk++; }
  const cells = cellsOf(p);
  const cols = new Map();
  for (const [x, y] of cells) { if (y >= 0 && G.board[y][x]) { const c = G.board[y][x]; if (c.token) { addTokens(1); spawnTokenFly(x, y); } G.board[y][x] = null; } cols.set(x, Math.max(cols.get(x) || 0, y)); }
  for (const [x, y] of cells) spawnBurst('metal', x, y, 5);
  G.piece = null;
  // only in the chair's columns, cells above fall straight down to close the gap
  for (const [x, low] of cols) {
    const keep = []; for (let y = low; y >= 0; y--) if (G.board[y][x]) keep.push(G.board[y][x]);
    for (let y = low; y >= 0; y--) G.board[y][x] = null;
    let y = low; for (const c of keep) { G.board[y][x] = c; y--; }
  }
  S.chair(); addTrauma(0.8); G.hitstop = Math.max(G.hitstop, 0.12); flash(0.25);
  crowdPop();
  G.score += Math.round(1000 * mult());
  const rows = fullRows();
  if (G.opp && G.opp.dizzy) {
    G.combo++; decideFinish(3, false, { chair: true });
    G.spawnT = TUNE.spawnDelay;
    return;
  }
  say('chairShot');
  if (rows.length) { onClear(rows, { chair: true }); }
  else {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    if (G.opp) {
      if (G.opp.tele > 0) denyAttack();
      if (!G.opp.dizzy) dealDamage(TUNE.chairDmg + (G.combo >= 2 ? TUNE.comboBonus : 0));
    }
    if (G.kind === 'match') checkDanger(true);
    G.spawnT = TUNE.spawnDelay;

  }
}

const BIGHEAD_CODE = ['rot', 'rot', 'left', 'right', 'drop'];
function titleCode(tok) {

  for (let i = 0; i < n; i++) if (G.code[i] !== BIGHEAD_CODE[i]) { G.code = tok === 'rot' ? ['rot'] : []; return false; }
  if (n === BIGHEAD_CODE.length) { G.code = []; G.bighead = true; audioUnlock(); S.bell(1); return true; }

function updateTitle(dt) {

  if (G.codeT != null) { G.codeT += dt; if (G.codeT > 2.5) { G.code = []; G.codeT = null; G.codeMode = false; } }
  if (G.tapStartT != null) { G.tapStartT -= dt; if (G.tapStartT <= 0) { G.tapStartT = null; if (!G.codeMode) titleStart(false); } }

function startAttract() {
  const k = pick(FRIENDS);
  const b = newBoard(); for (let y = ROWS - 7; y < ROWS; y++) { const hole = randi(0, 9); for (let x = 0; x < COLS; x++) if (x !== hole && Math.random() < 0.9) b[y][x] = { t: pick(BAG) }; }

function updateAttract(dt) {
  const A = G.attract; A.t += dt; A.drop += dt;
  if (!A.piece) { const t = pick(BAG); const p = makePiece(t); let r = randi(0, 3); while (r--) p.m = rotateM(p.m, 1); p.x = randi(-1, 8); A.piece = p; A.ty = 0; }

  const sb = G.board; G.board = A.board;
  while (collides(p)) { p.x += p.x < 4 ? 1 : -1; if (p.x > 9) { p.x = 3; break; } }
  if (A.drop > 0.06) { A.drop = 0; if (!collides(p, 0, 1)) p.y++; else { for (const [x, y] of cellsOf(p)) if (y >= 0) A.board[y][x] = { t: p.t }; A.piece = null; const rows = fullRows(); for (const y of rows) { A.board.splice(y, 1); A.board.unshift(new Array(COLS).fill(null)); A.hp = Math.max(0.05, A.hp - 0.1); } if (stackHeight() > 16) A.board = newBoard(); } }

}

/* ---------- Stage 0 foreshadowing ---------- */
function addCrack(big) {
  const rng = mulberry32((G.cracks.length + 1) * 7919 + (big ? 13 : 0));
  const x0 = L.W - rng() * 60 - 4, y0 = (L.it || 0) + rng() * 40 + 2; const pts = [[x0, y0]];
  let x = x0, y = y0, a = Math.PI * (0.6 + rng() * 0.6); const n = big ? 14 : 5;
  for (let i = 0; i < n; i++) { const len = (big ? 40 : 14) + rng() * (big ? 60 : 26); a += (rng() - 0.5) * 1.1; x += Math.cos(a) * len; y += Math.abs(Math.sin(a)) * len; pts.push([x, y]); }
  if (big) { G.bigCrack = pts; return; }
  G.cracks.push(pts);
}

const cv = document.getElementById('cv');

let DPR = 1;
const L = { W: 0, H: 0, it: 0, ib: 0, il: 0, ir: 0, cell: 20, wx: 0, wy: 0, ww: 0, wh: 0, portrait: true, strip: null, hud: null };
function readInsets() {

function layout() {

  } else {

    L.cell = cell; L.ww = cell * 10; L.wh = cell * 20;
    L.wx = Math.round((W - sr - L.ww) / 2); L.wy = Math.round(ins.t + (H - ins.t - ins.b - L.wh) / 2 + cell * 0.4);
    const colW = Math.max(90, Math.min(220, L.wx - 24 - ins.l));
    L.colL = { x: L.wx - 16 - colW, w: colW }; L.colR = { x: L.wx + L.ww + 16, w: Math.max(90, Math.min(220, W - sr - (L.wx + L.ww + 16) - 8)) };

function gameMusic() {

  if (G.kind === 'backroom') return 'backroom';
  if (G.kind === 'race') return G.race && !G.race.done ? 'race' : 'none';
  if (G.kind === 'match' && G.opp) {
    if (G.opp.dizzy) return 'kohold';

    if (G.opp.phase === 3 || G.danger) return 'breakdown';
