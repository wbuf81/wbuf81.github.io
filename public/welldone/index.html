/* ---------- contact (section 2.2) ---------- */

    return;
  }

  for (const e of all) {
    const hurts = e.kind === 'fish' ? (e.state === 'hunt' || e.state === 'leave') : (e.state === 'station' || e.state === 'hunt');
    if (!hurts && e.state !== 'flee') continue;

      if (!P.alive[q.i]) continue;
      if (dist2(q, e) >= R2) continue;
      if (e.state === 'flee') { sendBack(e); break; }
      if (P.graceT > 0) continue; // he blinks after a story fold: uncatchable

      } else if (!P.flags.hissT || P.tick - P.flags.hissT > 0.5) {

}
// story embers are harmless: Rob goes sooty for a moment (DESIGN_V2 1.4 course 2)
function singe() { if (P.sootT <= 0) sfx('emberHiss'); P.sootT = 0.6; if (!P.flags.hot) { P.flags.hot = true; small('HOT.'); } }

/* ---------- course end plumbing ---------- */

// DESIGN_V2 1.3: course clear = 1000 + 100 x max(0, closer - playT)
function clearBonus() { const S = TUNE.story; return Math.round(S.clearBase + S.clearPerSec * Math.max(0, P.C.closer - P.playT)); }

/* =====================================================================
   10. The six courses and endless (section 5, DESIGN_V2 1.4 and 3)
   ===================================================================== */
function courseSetup() {
  const fx = P.fx, cfg = P.cfg;
  if (fx.smoke) { P.alarmT = cfg.alarmEvery - cfg.alarmFirst; P.alarmOn = 0; if (P.story) musicMuffle(900); }

  if (fx.carry) { P.plateAt = M.pts.rob.slice(); P.carrying = false; P.deliveries = 0; P.doorFlash = 0; P.david = null; }
  if (fx.forks) {
    // story: fork 1 is a pair either side of Rob (take one, the other vanishes); endless: one fork on (9, 17)
    if (P.story) { const [rc, rr] = M.pts.rob; P.forks = [{ x: rc - 1, y: rr, excl: 1 }, { x: rc + 1, y: rr, excl: 1 }]; }
    else P.forks = [{ x: 9, y: 17 }];
    P.pairTaken = 0; P.forkT = null;
  }
  if (fx.lick) { P.cleaned = 0; P.lickN = 0; P.lastLick = -9; P.tongue = 0; }
  if (fx.spin) { P.spinClock = 0; P.spin = null; P.spinNext = cfg.spinFirst; }
  if (fx.friends) {
    P.friends = FRIENDS.map((id, k) => { const f = makeChaser(id, 'friend', FRIEND_START[k][0], FRIEND_START[k][1], 'run', 0); f.approach = id === 'hamzah'; f.speed = f.approach ? TUNE.story.hamzahSpeed : TUNE.story.eraSpeeds[0]; return f; });
    P.era = -1; P.yearText = '1999'; P.eraT = 0; P.eraCatches = 0; P.lineT = 0; P.lineI = 0;
  }
  if (!P.story) { P.year = END.year; P.eraCol = ERAS[(END.n - 1) % 5]; }
}
function courseGoLive() {
  P.phase = 'live';
  const c = P.course;
  if (c === 2) bubble('rob', 'WHAT IS THAT SMELL.');
  if (c === 3) { P.foldIn = 0; announce('THE ROOM TILTS!', { cut: true }); sfx('whoosh'); bubble('rob', "I'M TAKING THIS BACK MYSELF."); }
  if (c === 5) bubble('rob', "WHAT. THERE'S SAUCE.");
  if (c === 6) startJump();
  if (c === 7 && !isSeen('bigRoom')) later(1.0, () => { small('OH. THE ROOM IS BIGGER THAN HE REMEMBERED.'); markSeen('bigRoom'); });
}
function courseUpdate(dt) {
  const fx = P.fx, cfg = P.cfg;
  if (fx.smoke) {
    if (P.clockOn) { P.alarmT += dt; if (P.alarmT >= cfg.alarmEvery) { P.alarmT = 0; P.alarmOn = cfg.alarmDur; sfx('alarm'); if (!P.flags.alarm) { P.flags.alarm = true; announce('SMOKE ALARM!'); } } }
    if (P.alarmOn > 0) P.alarmOn = Math.max(0, P.alarmOn - dt);
  }
  if (fx.carry && P.doorFlash > 0) P.doorFlash -= dt;
  if (fx.forks) {
    const n = P.alive.filter(Boolean).length;
    if (P.flags.fork2 && n < 4 && !P.forks.length) { if (P.forkT == null) P.forkT = cfg.forkRespawn; P.forkT -= dt; if (P.forkT <= 0) { P.forkT = null; P.forks.push(farthestForkTile()); } }

    P.closerRunT = (P.closerRunT || 0) + dt;
    if (P.closerRunT >= 1.2 && !P.ended) { for (let k = 0; k < P.dot.length; k++) if (P.dot[k]) { P.dot[k] = 0; P.dotsEaten++; addScore(10); burst('crumb', tx(k % M.W), ty((k / M.W) | 0), 2, PAL.candle); } sfx('nom', { i: 1 }); courseWin('closer'); return; }
  }

function onChaserTile(e, from) {
  if (e.kind === 'fish' && e.state === 'hunt' && robOpen(from[0], from[1])) P.embers.set(from[1] * M.W + from[0], P.cfg.emberLife);
}
function onDot() {
  const n = P.dotsEaten, S = TUNE.story;
  if (!P.story) maybeComp();
  if (P.fx.fish && !P.fish && P.fishAt && n >= P.fishAt) fishWake();
  if (P.fx.forks && !P.flags.fork2 && n >= P.cfg.fork2At) spawnForkPair();
  switch (P.course) {
    case 1:
      if (n === 1) small('FREE BREAD!');
      if (n === Math.ceil(P.quota / 2)) musicIntensity(0.5);
      if (n >= P.quota && !P.special) {
        hitstop(0.2); P.special = { x: M.pts.comp[0], y: M.pts.comp[1], on: true };
        announce('THE SPECIAL IS UP!'); small('GO AND ORDER IT.'); musicIntensity(1); logEv('special');
      }
      break;
    case 2:
      if (n === Math.ceil(P.quota * 0.3)) small("HE'S EATING THE PARSLEY.");
      if (n >= P.quota) courseWin(P.closerFired ? 'closer' : 'win');
      break;
    case 4: {
      const left = P.dotsTotal - n;
      if (left === S.halfLeft) announce('HALFWAY! HE HATES IT!');
      if (left === S.stopLeft) { bubble('fish', '(YOU COULD STOP.)'); later(1.2, () => bubble('rob', "I'M NOT PAYING FOR NOTHING.")); }
      if (left <= 0) courseWin(P.closerRun ? 'closer' : 'win');

/* ---------- course 2 / endless A: smoke, the fish gets up ---------- */
function fishWake() {
  hitstop(P.story ? TUNE.story.fishHit : 0.4); au('cut', 400); sfx('fishWake'); shake(3);
  const pm = M.home; const f = makeChaser('fish', 'fish', pm[0], pm[1], 'wait', 0); f.release = P.clock + 0.6; f.dir = -1;
  P.fish = f;
  announce("IT'S ALIVE?!", { cut: true }); announce('NO. VERY DEAD. JUST ANGRY.');
  bubble('fish', '(I WAS A GOOD FISH.)');

/* ---------- course 3: carry the plate, twice (DESIGN_V2 1.4) ---------- */
function c3Door() { const d = M.pts.door; return [d[0], d[1] + 1]; } // the delivery tile in front of the kitchen door
function c3Pickups() {
  const q = playerRob(), c = wc(Math.round(q.x)), r = Math.round(q.y), [dc, dr] = c3Door();
  if (!P.carrying && P.plateAt && dist2(q, { x: P.plateAt[0], y: P.plateAt[1] }) < 0.36) {

    if (P.deliveries >= TUNE.story.trips - 1 && !P.david) { P.david = { x: dc, y: dr, frame: 'idle' }; announce('HERE COMES DAVID!'); sfx('slam'); logEv('david'); }
  }

  if (P.david && r === dr && Math.abs(c - dc) <= 2) { c3Fold(false); return; }

  const [dc, dr] = c3Door();
  P.carrying = false; P.deliveries++; const n = P.deliveries;
  addScore(1000, tx(dc), ty(dr), PAL.candle); sfx('sendback'); sfx('plateDown'); P.doorFlash = 0.8; shake(3);
  logEv('deliver', { n });
  musicIntensity(n / TUNE.story.trips);
  later(TUNE.story.plateBack, () => { sfx('ding'); P.plateAt = M.pts.rob.slice(); });
  const rel = (id) => { for (const e of P.chasers) if (e.id === id && e.hold) { e.hold = false; e.release = P.clock; } };
  if (n === 1) { rel('tino'); announce('SENT BACK!'); bubble('david', "IT'S CALLED BLACKENED."); small('ONE MORE. HE MEANS IT THIS TIME.'); }
}
function c3Fold(closer) {
  if (P.ended) return;
  P.ended = true; P.how = closer ? 'closer' : 'win';
  logEv('courseEnd', { course: 3, playT: +P.playT.toFixed(2), how: P.how });
  P.bellT = 0; musicSection('main'); P.comp = null;
  for (const e of P.chasers) e.frozen = true;

/* ---------- course 4 / endless B: forks and mirror Robs ---------- */
function farthestForkTile() {
  const W = M.W, H = M.H;
  const cand = P.story ? [[1, 1], [W - 2, 1], [1, H - 2], [W - 2, H - 2]] : [[3, 7], [15, 7], [3, 17], [15, 17]];
  const from = P.story ? [playerRob()] : livingRobs();
  let best = cand[0], bd = -1;
  for (const t of cand) { let md = 1e9; for (const q of from) md = Math.min(md, (q.x - t[0]) ** 2 + (q.y - t[1]) ** 2); if (md > bd) { bd = md; best = t; } }
  return { x: best[0], y: best[1] };
}
function spawnForkPair() {
  P.flags.fork2 = true; const f = farthestForkTile();
  P.forks = P.forks.filter((x) => !x.excl);
  P.forks.push(f, { x: M.W - 1 - f.x, y: f.y, pair: true }); f.pair = true;
  logEv('forkPair', { x: f.x, y: f.y });
}
function takeFork(fk) {
  const next = [1, 2, 3, 0].find((k) => !P.alive[k]);
  if (next == null) return;
  if (fk.excl) P.forks = P.forks.filter((f) => !f.excl); // the start pair: whichever he takes, the other vanishes
  if (fk.pair) P.pairTaken++;
  // story: the 12-bite pair always delivers FOUR ROBS (first fork: three, second: four), reviving popped mirrors
  const want = P.story && fk.pair ? Math.min(4, 2 + P.pairTaken) : P.alive.filter(Boolean).length + 1;
  for (let k = next; P.alive.filter(Boolean).length < want; ) {
    P.alive[k] = true; const q = robAt(k); burst('spark', tx(q.x), ty(q.y), 8, PAL.candle);
    const nk = [1, 2, 3, 0].find((j) => !P.alive[j]); if (nk == null) break; k = nk;
  }
  sfx('forkGet');
  const n = P.alive.filter(Boolean).length; logEv('fork', { robs: n }); musicIntensity((n - 1) / 3);
  if (n === 2 && !P.flags.two) { P.flags.two = true; announce('TWO ROBS!'); small("HE'S EATING WITH BOTH HANDS."); }
  if (n === 4 && !P.flags.four && (P.story || fk.pair)) { P.flags.four = true; announce('FOUR ROBS! ONE FISH!'); } // story: however he gets there
}

/* ---------- course 5 / endless P: the tongue and the plate spin ---------- */
function lickFrom(q, c, r) {

function runSeq(def) {

}

  SKIPPING = was; s.t = Math.max(s.t, to);
}
function updateSeq(dt) {
  const s = G.seq; if (!s) return;
  s.t += dt;
  while (G.seq === s && s.ci < s.cues.length && s.cues[s.ci][0] <= s.t) s.cues[s.ci++][1]();
  if (G.seq !== s) return;

  if (G.seq === s && !s.hold && s.t >= s.dur) endSeq();
}

}

  trySkip();
}

  const go = { x: 30, y: 498, w: 300, h: 44, label: 'COMPLAIN FOREVER', fn: () => startEndless(), style: 'hot', visible: false, fill: 0 };
  const btns = [go, { x: 30, y: 558, w: 300, h: 44, label: 'TITLE', fn: () => toTitle(), visible: false }];

    onTap() { const s = G.seq; if (!s.hold && (isSeen('review') || s.t >= 2.0)) fastForward(5.2, true); },
    onTouch() { const s = G.seq; if (s.hold) s.frozen = true; } }); // any other touch freezes the fill for good
}

/* ---------- course 3: the room tilts into 3-D (DESIGN_V2 1.4: the projection, generalised) ---------- */

const c3v = (y) => (M.H - 0.5 - y) / M.H;
function sOf(y, f) { return 1 / (1 + TUNE.c3k * f * c3v(y)); }

      if (tgt < 0) continue; tot = -bv;
    } else { if (tgt < 0) continue; tot = cd.cost + res.dist[tgt] + (cd.kind === 'behind' ? BOT_REV_BIAS : 0); }
    if (!best || tot < best.tot) best = { cd, tot, first: res.first[tgt] };
  }
  if (!best) return -2;
  const cd = best.cd, f = best.first;
  if (cd.kind === 'here') return f;
  if (cd.kind === 'ahead') return f < 0 ? R.dir : f;
  // the route starts from the centre behind him
  if (f < 0 || f === opp(R.dir)) return opp(R.dir);
  if (f !== R.dir && cd.past <= TUNE.corner * 0.9) return f; // a late turn, refunded
  return opp(R.dir);
}
function botDecide() {
  const cands = botCands();
  const goals = goalFn([cands[0].c, cands[0].r]); const { dz, near, tt } = dangerMap();
  if (P.story) {
    // story catches cost 0.9 s and send the catcher home: the bot only avoids walking into someone, then just goes
    // (course 4 keeps the careful planner: a popped mirror Rob costs eating power)
    let d = botRoute(cands, goals, near, tt, false, 0.05);
    if (d === -2) d = botRoute(cands, goals, new Uint8Array(near.length), null, false);
    return d === -2 ? -1 : d;
  }
  let d = botRoute(cands, goals, dz, tt, false);
  if (d === -2) d = botRoute(cands, goals, near, tt, false, 0.08); // a tighter race: still beats every chaser there
  if (d === -2) d = botRoute(cands, goals, near, tt, true, 0.08);  // nothing safe to eat: wait somewhere safe
  if (d === -2) d = botRoute(cands, goals, near, null, false);     // section 12.5 fallback
  if (d !== -2) return d;
  // no route: step to the neighbour farthest from the nearest hunter
  const hunters = threats(); if (!hunters.length) return -1;
  const [fc, fr] = [cands[cands.length - 1].c, cands[cands.length - 1].r];
  let best = -1, bd = -1;
  for (let k = 0; k < 4; k++) { const c = fc + DX[k], r = fr + DY[k]; if (!robOpen(c, r)) continue; const v = tt[tidx(c, r)]; if (v > bd) { bd = v; best = k; } }
  return best;
}
// DESIGN_V2 4.3: the random-walk bot. At every tile centre it takes a uniformly random open
// neighbour, never reversing unless it must. No danger map, no goals. (It stands in for the human.)
function botRandomTick() {
  const R = P.rob; let c, r, from;
  if (!R.moving) { c = wc(Math.round(R.x)); r = Math.round(R.y); from = R.dir; }
  else {
    const horiz = (R.dir & 1) === 1, sg = (R.dir === RIGHT || R.dir === DOWN) ? 1 : -1, a = horiz ? R.x : R.y;
    const prev = sg > 0 ? Math.floor(a + 1e-6) : Math.ceil(a - 1e-6), past = Math.abs(a - prev);
    if (past <= TUNE.corner + 0.02) return; // decide for the next centre only once the last one is out of turning range
    const nx = prev + sg; c = horiz ? wc(nx) : wc(Math.round(R.x)); r = horiz ? Math.round(R.y) : nx; from = R.dir;
  }
  const key = (r * M.W + c) * 8 + (R.moving ? from : 4 + from);
  if (key === BOT.rKey) return;
  BOT.rKey = key;
  const back = opp(from); let opts = [];
  for (let d = 0; d < 4; d++) if (d !== back && robCan(c, r, d)) opts.push(d);
  if (!opts.length && robCan(c, r, back)) opts = [back];
  if (!opts.length) return;
  const d = opts[rndi(opts.length)];

}
function botTick(dt) {
  if (G.autoMode === 'random') { botRandomTick(); return; }
  BOT.t -= dt; if (BOT.revT > 0) BOT.revT -= dt;
  const R = P.rob; const key = tidx(Math.round(R.x), Math.round(R.y)) * 5 + (R.moving ? R.dir : 4);
  if (key === BOT.tile && BOT.t > 0) return;
  BOT.tile = key; BOT.t = 0.15;
  const bd = botDecide(); if (bd < 0) return;
  inputDir(tDir(P.pi, bd), false);
}
// course 4's closer: every Rob speeds up and paths to the bites by itself
function closerPilot() {
  const W = M.W, alive = [0, 1, 2, 3].filter((i) => P.alive[i]);
  const set = new Uint8Array(W * M.H);
  for (let k = 0; k < P.dot.length; k++) if (P.dot[k]) for (const i of alive) { const [bc, br] = tMap(i, k % W, (k / W) | 0); set[tidx(bc, br)] = 1; }
  const d = botRoute(botCands(), set, new Uint8Array(W * M.H), null, false);
  if (d < 0) return;
  const R = P.rob;
  if (R.moving && d === opp(R.dir)) { R.dir = d; R.want = -1; } else if (d !== R.dir || !R.moving) { R.want = d; R.wantT = TUNE.buffer; } else R.want = -1;
}

/* =====================================================================
   14. The update loop
   ===================================================================== */
function update(dt) {
  G.simT += dt;
  if (G.humanT > 0) G.humanT -= dt;
  if (G.paused) return;
  updateText(dt); updateParts(dt);
  if (G.shakeA > 0) { G.shakeT += dt; if (G.shakeT >= TUNE.shakeDecay) G.shakeA = 0; }
  if (G.flashA > 0) G.flashA = Math.max(0, G.flashA - dt * 2.5);
  if (P && P.flash4 > 0) P.flash4 = Math.max(0, P.flash4 - dt * 2);
  switch (G.scene) {
    case 'title': G.t += dt; if (G.auto && G.t > 1.0) startRun(); break;
    case 'card': updateSeq(dt); break;
    case 'play': updatePlay(dt); break;
    case 'seq': updateSeq(dt); if (G.auto && G.seq && G.seq.hold) autoHold(dt); break;
  }
}
function autoHold(dt) { /* the review card's COMPLAIN FOREVER fills and starts endless by itself; nothing else holds */ }
function updatePlay(dt) {
  P.playT += dt; P.tick += dt;
  runTimers();
  if (P.bustT > 0) P.bustT -= dt;
  if (P.frameFlash > 0) P.frameFlash -= dt;
  const R = P.rob; if (R.ox || R.oy) { const k = Math.exp(-dt / 0.05); R.ox *= k; R.oy *= k; if (Math.abs(R.ox) < 0.01) R.ox = 0; if (Math.abs(R.oy) < 0.01) R.oy = 0; }
  for (const e of P.chasers) if (e.ox || e.oy) { e.ox *= 0.8; e.oy *= 0.8; }
  if (P.fx.carry && P.foldIn != null) P.foldIn += dt;
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  switch (P.phase) {
    case 'live': stepLive(dt); break;
    case 'caught': P.catchT += dt; if (P.catchT >= (P.story ? TUNE.story.freeze : TUNE.catchFreeze)) afterCatch(); break;
    case 'reset': P.resetT -= dt; if (P.resetT <= 0) P.phase = 'live'; break;
    case 'clear': updateClear(dt); break;
    case 'jump': updateJump(dt); break;
    case 'spin': updateSpin(dt); break;
    case 'closerAnim': updateCloserAnim(dt); break;
  }
}

/* =====================================================================
   15. Debug hooks (section 12.4) and boot
   ===================================================================== */
function debugKey(k) {
  if (k === 'n') WD.win(); else if (k === 'c') WD.closer(); else if (k === 'h') WD.hurt(); else if (k === 'b') WD.ring();
  else if (k === 'g') G.god = !G.god; else if (k === 'o') WD.autoplay(!G.auto);
  else if (k === '+' || k === '=') WD.speed(Math.min(8, G.timeScale * 2)); else if (k === '-') WD.speed(Math.max(0.25, G.timeScale / 2));
  else if (/^[0-9]$/.test(k)) WD.jump(+k);
}
function stateSnapshot() {
  const s = { scene: G.seq ? (G.seq.kind || G.scene) : G.scene, course: G.course, playT: P ? +P.playT.toFixed(2) : 0, score: G.score, patience: G.patience,
    dotsLeft: P ? P.dotsTotal - P.dotsEaten : 0, dotsTotal: P ? P.dotsTotal : 0, bellT: P ? +P.bellT.toFixed(2) : 0, robs: [], chasers: [],
    sends: P ? P.chasers.filter((e) => e.state === 'sent' || e.state === 'sentWait').length : 0, carrying: !!(P && P.carrying), clean: P && P.fx.lick ? +(P.cleaned / P.sauceTotal).toFixed(3) : null,
    era: P && P.fx.friends ? P.era + 1 : null, year: P ? (P.fx.friends ? P.yearText : P.course === 7 ? END.year : null) : null, fps: +G.fps.toFixed(1),
    phase: P ? P.phase : null, deliveries: P && P.fx.carry ? P.deliveries : null, simT: +G.simT.toFixed(2),
    mode: G.mode, folds: G.folds, mazeN: G.mode === 'endless' ? END.n : 0, T: M ? M.T : 0, maze: M ? M.name : null, grace: P ? +P.graceT.toFixed(2) : 0 };
  if (P) {
    for (let i = 0; i < 4; i++) if (P.alive[i]) { const q = robAt(i); s.robs.push({ c: +q.x.toFixed(2), r: +q.y.toFixed(2), dir: DIRN[q.dir], player: i === P.pi }); }
    for (const e of P.chasers.concat(P.fish ? [P.fish] : []).concat(P.friends || [])) s.chasers.push({ id: e.id, c: +e.x.toFixed(2), r: +e.y.toFixed(2), state: e.state });
  }
  return s;
}
function freshStory() { G.mode = 'story'; G.score = 0; G.folds = 0; G.firstCatch = false; G.runStart = G.simT; }
const WD = {
  // DESIGN_V2 4.3: 0 title, 1-6 story course card, 7 endless (maze 1), 8 review card with the current score, 9 the rewind and last ticket
  jump(n) {
    n = n | 0; G.paused = false; G.btns = [];
    if (n === 0) { toTitle(); return; }
    if (n >= 1 && n <= 6) { if (G.scene === 'title' || G.scene === 'boot' || G.mode !== 'story') freshStory(); startCourse(n); return; }
    if (n === 7) { startEndless(1); return; }
    if (n === 8) { if (G.mode !== 'story') G.mode = 'story'; startReview(); return; }
    if (n === 9) { if (G.scene === 'title' || G.scene === 'boot' || G.mode !== 'story') freshStory(); startRewind(); return; }
  },
  endlessAt(n) { G.paused = false; startEndless(Math.max(1, n | 0)); },
  autoplay(on) { G.auto = !!on && on !== 'off'; G.autoMode = on === 'random' ? 'random' : 'smart'; BOT.tile = -1; BOT.rKey = -1; },
  speed(m) { G.timeScale = clamp(+m || 1, 0.1, 8); },
  win() {
    if (!P || G.scene !== 'play' || P.ended) return;
    if (P.course === 3) c3Fold(false);
    else if (P.course === 6) { if (P.phase === 'live' || P.phase === 'jump') { P.era = ERAS.length - 1; P.phase = 'live'; eraOver(); } }
    else if (P.course === 7) endlessClear();
    else courseWin('win');
  },
  closer() { if (P && P.story && G.scene === 'play' && !P.ended) { P.playT = Math.max(P.playT, P.C.closer); courseCloser(); } },
  hurt() { if (P && P.fx.friends) return; if (P && G.scene === 'play' && P.phase === 'live') { const g = G.god, gr = P.graceT; G.god = false; P.graceT = 0; const e = P.chasers.find((x) => x.state === 'hunt' || x.state === 'station') || P.chasers[0]; robCaught(P.pi, e ? e.id : 'kyle', e); G.god = g; if (P.phase === 'live') P.graceT = gr; } else if (!P || !P.story) G.patience = Math.max(0, G.patience - 1); },
  ring() { if (P && G.scene === 'play' && P.phase === 'live') { const q = playerRob(); ringBell(Math.round(q.x), Math.round(q.y)); } },
  state: stateSnapshot,
  log: LOG,
  inputLog: INPUT_LOG,
  MAZES, COURSES, RAMP,
  reset() { SAVE = freshSave(); SEEN_SESSION.clear(); try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },
  // testing helpers (not in the spec's list; harmless)
  advance(sec) { const n = Math.round((sec || 1) / STEP); for (let i = 0; i < n; i++) update(STEP); return stateSnapshot(); },
  swipe(dir) { const d = typeof dir === 'string' ? DIRN.indexOf(dir) : dir; if (d >= 0) inputDir(d, true); },
  tap() { onTap(180, 320); },
  skip() { onSkipKey(); },
  seed(n) { SEED = n | 0; rng = mulberry32(SEED); },
  rob() { if (!P) return null; const R = P.rob; return { x: R.x, y: R.y, dir: DIRN[R.dir], moving: R.moving, want: R.want >= 0 ? DIRN[R.want] : null, wantT: +R.wantT.toFixed(3) }; },
  place(c, r, dir) { if (!P) return; const R = P.rob; R.x = c; R.y = r; R.dir = DIRN.indexOf(dir || 'left'); R.moving = false; R.want = -1; R.ox = R.oy = 0; },
  render() { render(); },
  get G() { return G; }, get P() { return P; }, TUNE, layout() { layout(); return Object.assign({}, L); },
  artErrors() { return Object.assign({}, ARTERR); },
  botOpt(k, v) { BOT[k] = v; },
  botDebug() { if (!P) return null; const c = botCands(); const dm = dangerMap(); return { cands: c, d: botDecide(), dz: c.map((x) => dm.dz[tidx(x.c, x.r)]), tt: c.map((x) => +dm.tt[tidx(x.c, x.r)].toFixed(2)), humanT: G.humanT, auto: G.auto }; },
};
window.WD = WD;

let lastFrame = nowS(), acc = 0, fpsT = 0, fpsN = 0;
function frame() {
  const now = nowS(); const real = Math.min(0.1, Math.max(0, now - lastFrame)); lastFrame = now;
  RT += real; fpsT += real; fpsN++; if (fpsT >= 0.5) { G.fps = fpsN / fpsT; fpsT = 0; fpsN = 0; }
  acc += real * G.timeScale;
  const cap = Math.round(8 * Math.max(1, G.timeScale)); let n = 0;
  while (acc >= STEP && n < cap) { update(STEP); acc -= STEP; n++; }
  if (n >= cap) acc = 0;
  try { render(); } catch (e) { if (!frame.err) { frame.err = 1; console.error(e); } }
  requestAnimationFrame(frame);
}

function boot() {
  HEADLESS = !!window.__WD_HEADLESS;
  syncPalette(); layout();
  try { document.title = 'WELL DONE!'; } catch (e) { }
  if (G.muted) au('setMuted', true);
  if (OPT.level >= 1 && OPT.level <= 6) { freshStory(); startCourse(OPT.level); }
  else if (OPT.level === 7 || OPT.maze >= 1) startEndless(Math.max(1, OPT.maze));
  else if (OPT.level === 8) { freshStory(); startReview(); }
  else if (OPT.level === 9) { freshStory(); startRewind(); }
  else toTitle();
  if (DEBUG) console.log('[WD] ready. seed', SEED, 'bot', G.auto ? G.autoMode : 'off', 'keys: n win, c closer, h hurt, b bell, g god, o bot, +/- speed, 0-9 jump');
  if (!HEADLESS && typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

boot();
})();
