name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22+ is required by the add-health-week loader smoke test — the
          # script leans on Node's native TypeScript support to load
          # lib/health.ts, which Node 20 (EOL) doesn't have.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Includes the add-health-week loader smoke test, so a refactor that
      # breaks the weekly import script fails the deploy instead of surfacing
      # on the next paste night.
      - name: Test
        run: npm test

      # The /health card shows real numbers from data/health.json, so it is
      # redrawn on every deploy rather than relying on the committed PNG being
      # current. Importing a week is a push, so the card is never stale.
      # Chrome is preinstalled on the runner image.
      - name: Redraw the /health link preview
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/og/build-og.py health

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
